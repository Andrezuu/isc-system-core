name: Deploy backend

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install --omit-dev

      - name: Build de backend
        run: npm run build

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Subir backend con SCP
        run: |
          echo "${{ secrets.EC2_KEY }}" > private_key.pem
          chmod 600 private_key.pem

          scp -i private_key.pem -r dist/* package*.json ubuntu@${{ secrets.EC2_HOST }}:/var/www/api

          # Subir .env
          ssh -i private_key.pem ubuntu@${{ secrets.EC2_HOST }} "echo '${{ secrets.BACKEND_ENV }}' > /var/www/api/.env && chmod 600 /var/www/api/.env"

          rm private_key.pem

      - name: Reiniciar el backend con pm2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /var/www/api
            npm install --omit-dev          
            pm2 restart api || pm2 start index.js --name api
            pm2 save


